services:
  - type: web
    name: image-similarity
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install gunicorn
    startCommand: gunicorn --bind 0.0.0.0:10000 --workers 2 --timeout 60 app:app
    envVars:
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: PORT
        value: '10000'
